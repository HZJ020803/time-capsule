<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cyber Time Capsule</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 30px;
    line-height: 1.6;
    background-color: #f8f8f8;
}

h1 {
    text-align: center;
    color: #333333;
}

h2 {
    color: #444444;
}

.card {
    border: 1px solid #cccccc;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
    background-color: #ffffff;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
}

.photo {
    width: 300px;
    margin: 10px;
    border: 3px solid #888888;
    border-radius: 10px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
}

.video {
    width: 700px;
    border: 3px solid #888888;
    border-radius: 10px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
}

pre {
    background-color: #f0f0f0;
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
}

</style>
</head>

<body>

<h1>Cyber Time Capsule</h1>

<div class="card">
<h2>TC-YYYY-XXXXXX</h2>
<p><strong>Created:</strong> YYYY-MM-DD</p>
</div>

<div class="card">
<h2>Photos</h2>
<img class="photo" src="photo1.jpg">
<img class="photo" src="photo2.jpg">
<img class="photo" src="photo3.jpg">
</div>

<div class="card">
<h2>Video</h2>
<video class="video" controls>
    <source src="video1.mp4" type="video/mp4">
    Your browser does not support video.
</video>
</div>

<div class="card">
<h2>Letter To Future</h2>
<pre>
这里放置时间胶囊文字内容。

未来打开它的人，
希望能看到现在的自己。
</pre>
</div>

</body>
</html>
